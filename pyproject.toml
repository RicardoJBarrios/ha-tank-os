[project]
name = "ha-tank-os"
version = "0.0.0"
requires-python = ">=3.14.2"
dependencies = []

[project.optional-dependencies]
test = [
  "homeassistant==2026.9.4",
  "pytest==9.0.3",
  "pytest-homeassistant-custom-component==0.13.367",
]

[tool.uv]
package = false

[tool.mypy]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
  "(^|/)(\\.agents|\\.specify|_bmad|openspec)(/|$)",
]

[tool.bandit]
exclude_dirs = [
  ".agents",
  ".specify",
  "_bmad",
  "openspec",
  ".venv",
  "node_modules",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
asyncio_mode = "auto"
pythonpath = ["."]
